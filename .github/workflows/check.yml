name: check
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: bun install --frozen-lockfile
      - run: bun run check:coverage
      - run: bun run check
      - run: bun run test
      - name: Build and verify Pages paths
        env:
          SITE: https://${{ github.repository_owner }}.github.io
          BASE: /${{ github.event.repository.name }}/
        run: |
          bun run build
          base="${BASE%/}"
          grep -q "href=\"$base/_astro/" dist/index.html
          grep -q "src=\"$base/_astro/" dist/index.html
