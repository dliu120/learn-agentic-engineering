name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - run: bun install --frozen-lockfile
      - run: bun run check:coverage
      - run: bun run check
      - run: bun run test
      - name: Build and verify Pages paths
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          bun run build
          base="${BASE%/}"
          grep -q "href=\"$base/_astro/" dist/index.html
          grep -q "src=\"$base/_astro/" dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
